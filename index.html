<title>每日法语一句</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#EDF0F2;
  --surface:#FFFFFF;
  --surface-2:#F5F7F8;
  --ink:#16222B;
  --ink-soft:#516472;
  --ink-faint:#8093A0;
  --line:#DDE3E7;
  --accent:#2B5C86;
  --accent-soft:#E3EDF5;
  --gloss:#9A6614;
  --gloss-soft:#F6EEDD;
  --ok:#2F6B4F;
  --shadow:0 1px 2px rgba(22,34,43,.06), 0 8px 24px rgba(22,34,43,.07);
  --fr:"Fraunces",Georgia,"Times New Roman",serif;
  --zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --ui:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1720;
    --surface:#18222D;
    --surface-2:#1F2B37;
    --ink:#E9EEF2;
    --ink-soft:#A8B8C4;
    --ink-faint:#7D8E9B;
    --line:#2B3945;
    --accent:#7FB4DC;
    --accent-soft:#1F3446;
    --gloss:#E5B76A;
    --gloss-soft:#33291A;
    --ok:#7FC29B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1720;
  --surface:#18222D;
  --surface-2:#1F2B37;
  --ink:#E9EEF2;
  --ink-soft:#A8B8C4;
  --ink-faint:#7D8E9B;
  --line:#2B3945;
  --accent:#7FB4DC;
  --accent-soft:#1F3446;
  --gloss:#E5B76A;
  --gloss-soft:#33291A;
  --ok:#7FC29B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--zh);
  font-size:17px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.wrap{
  max-width:34rem;
  margin:0 auto;
  padding-inline:18px;
  padding-block:20px 40px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

/* ---------- header ---------- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--fr);font-size:1.45rem;font-weight:600;letter-spacing:.01em}
.brand span{font-family:var(--zh);font-size:1.05rem;font-weight:500;color:var(--ink-soft);margin-left:8px}
.meta{font-family:var(--ui);font-size:.8rem;color:var(--ink-faint);letter-spacing:.04em}

/* ---------- card ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:20px 18px 22px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.scene{
  display:flex;align-items:center;gap:10px;
  font-family:var(--ui);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);
}
.scene b{font-family:var(--zh);font-size:.95rem;letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink-soft)}
.scene .num{
  font-variant-numeric:tabular-nums;
  background:var(--accent-soft);color:var(--accent);
  border-radius:6px;padding:2px 7px;font-weight:600;letter-spacing:.06em;
}

/* french sentence: each word tappable */
.sentence{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:baseline}
.w{
  font-family:var(--fr);
  font-size:2rem;
  line-height:1.25;
  font-weight:400;
  color:var(--ink);
  background:none;border:0;
  border-bottom:2px dotted var(--line);
  padding:2px 3px 3px;
  margin:0;
  border-radius:4px;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.w:hover{background:var(--accent-soft)}
.w.on{background:var(--accent);color:#fff;border-bottom-color:transparent}
.punct{font-family:var(--fr);font-size:2rem;color:var(--ink-soft);padding-bottom:3px}

.zh-main{font-size:1.3rem;font-weight:500;line-height:1.5}
.approx{
  font-size:.95rem;color:var(--ink-soft);
  background:var(--gloss-soft);
  border-radius:8px;padding:8px 11px;
}
.approx b{color:var(--gloss);font-weight:500}

/* play row */
.plays{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{
  font-family:var(--ui);font-size:1rem;font-weight:500;
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 18px;border-radius:10px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;cursor:pointer;
}
:root[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn{}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0F1720}}
:root[data-theme="dark"] .btn{color:#0F1720}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
:root[data-theme="dark"] .btn.ghost{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--accent)}}
.btn.ghost[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.btn:active{transform:translateY(1px)}

/* ---------- breakdown ---------- */
.section-label{
  font-family:var(--ui);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);
  display:flex;align-items:center;gap:10px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}
.rows{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:4px 12px;align-items:center;
  background:var(--surface);
  padding:12px 14px;
  border:0;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;
}
.row:hover{background:var(--surface-2)}
.row.on{background:var(--accent-soft)}
.row .fr{font-family:var(--fr);font-size:1.25rem;color:var(--ink)}
.row .zh{font-size:1.05rem;color:var(--ink);font-weight:500}
.row .note{grid-column:1/-1;font-size:.88rem;color:var(--ink-soft)}
.row .spk{font-size:1.1rem;color:var(--accent);justify-self:end}

.tip{
  font-size:.95rem;color:var(--ink-soft);
  border-left:3px solid var(--gloss);
  padding:2px 0 2px 12px;
}
.tip b{color:var(--ink);font-weight:500}

/* ---------- nav ---------- */
.nav{display:flex;gap:10px}
.nav .btn{flex:1;justify-content:center}
.learned{
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--ui);font-size:.95rem;color:var(--ink-soft);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px;cursor:pointer;width:100%;
}
.learned[aria-pressed="true"]{color:var(--ok);border-color:var(--ok)}

/* ---------- index ---------- */
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
summary{padding:13px 16px;cursor:pointer;font-family:var(--ui);font-size:.95rem;color:var(--ink-soft);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";float:right;color:var(--ink-faint)}
details[open] summary::after{content:"▴"}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{
  display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:10px;align-items:baseline;
  padding:11px 16px;border:0;border-top:1px solid var(--line);background:var(--surface);
  font:inherit;color:inherit;text-align:left;cursor:pointer;
}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item .n{font-family:var(--ui);font-size:.8rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.item .t{font-family:var(--fr);font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .g{font-size:.82rem;color:var(--ink-faint)}
.item.done .n::before{content:"✓ ";color:var(--ok)}
.item.today{background:var(--accent-soft)}

.foot{font-family:var(--ui);font-size:.82rem;color:var(--ink-faint);line-height:1.7}
.warn{color:var(--gloss);font-size:.88rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){ .w,.punct{font-size:1.7rem} .zh-main{font-size:1.2rem} }
</style>

</div>

/* ---------------- 状态 ---------------- */
const SLOW_KEY="fl-slow", DONE_KEY="fl-done", IDX_KEY="fl-idx";
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let done = store.get(DONE_KEY,[]) || [];
let slow = store.get(SLOW_KEY,false);
const todayIndex = (()=>{
  const days = Math.floor(Date.now()/86400000);
  return ((days % LESSONS.length) + LESSONS.length) % LESSONS.length;
})();
let current = todayIndex;

/* ---------------- 发音 ---------------- */
let frVoice=null;
function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const fr = vs.filter(v=>/^fr(-|_|$)/i.test(v.lang||""));
  if(!fr.length){ frVoice=null; return; }
  frVoice = fr.find(v=>/fr-FR/i.test(v.lang) && /Thomas|Amélie|Amelie|Audrey|Marie|Google/i.test(v.name))
         || fr.find(v=>/fr-FR/i.test(v.lang))
         || fr[0];
}
function voiceNote(){
  const el=document.getElementById("voice-note");
  if(!window.speechSynthesis){ el.innerHTML=' <span class="warn">这个浏览器不支持朗读，请换用 Safari 或 Chrome。</span>'; return; }
  el.innerHTML = frVoice ? "" : ' <span class="warn">还没找到法语语音，按下面的步骤装一个就能听了。</span>';
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.onvoiceschanged = ()=>{ pickVoice(); voiceNote(); };
}
function speak(text){
  if(!window.speechSynthesis || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = frVoice ? frVoice.lang : "fr-FR";
  if(frVoice) u.voice = frVoice;
  u.rate = slow ? 0.6 : 0.88;
  u.pitch = 1;
  speechSynthesis.speak(u);
}
function flash(el){
  if(!el) return;
  el.classList.add("on");
  setTimeout(()=>el.classList.remove("on"), slow?1400:850);
}

/* ---------------- 渲染 ---------------- */
const $ = id=>document.getElementById(id);
function sentenceText(l){
  return l.fr.reduce((s,[w])=>{
    const isPunct = /^[,.!?;:]$/.test(w);
    return s + (s && !isPunct ? " " : "") + w;
  },"");
}
function render(){
  const l = LESSONS[current];
  $("lesson-num").textContent = String(current+1).padStart(2,"0");
  $("lesson-scene-fr").textContent = l.sceneFr;
  $("lesson-scene-zh").textContent = l.scene;

  const s = $("sentence"); s.textContent = "";
  l.fr.forEach(([w,zh])=>{
    if(!zh){ const p=document.createElement("span"); p.className="punct"; p.textContent=w; s.appendChild(p); return; }
    const b=document.createElement("button");
    b.className="w"; b.type="button"; b.textContent=w;
    b.setAttribute("aria-label", w+"，"+zh+"，点击发音");
    b.addEventListener("click",()=>{ speak(w); flash(b); });
    s.appendChild(b);
  });

  $("translation").textContent = l.zh;
  $("approx").textContent = l.approx;
  $("tip").innerHTML = l.tip;

  const rows = $("rows"); rows.textContent="";
  l.fr.filter(([,zh])=>zh).forEach(([w,zh,note])=>{
    const r=document.createElement("button");
    r.className="row"; r.type="button";
    const f=document.createElement("span"); f.className="fr"; f.textContent=w;
    const z=document.createElement("span"); z.className="zh"; z.textContent=zh;
    r.appendChild(f); r.appendChild(z);
    if(note){ const n=document.createElement("span"); n.className="note"; n.textContent=note; r.appendChild(n); }
    r.addEventListener("click",()=>{ speak(w); flash(r); });
    rows.appendChild(r);
  });

  const isDone = done.includes(current);
  const lb = $("learned");
  lb.setAttribute("aria-pressed", isDone?"true":"false");
  lb.textContent = isDone ? "✓ 已经学会了" : "☐ 标记为「学会了」";

  renderList();
  store.set(IDX_KEY, current);
}
function renderList(){
  const list=$("list"); list.textContent="";
  LESSONS.forEach((l,i)=>{
    const b=document.createElement("button");
    b.className="item"+(done.includes(i)?" done":"")+(i===current?" today":"");
    b.type="button";
    const n=document.createElement("span"); n.className="n"; n.textContent=String(i+1).padStart(2,"0");
    const t=document.createElement("span"); t.className="t"; t.textContent=sentenceText(l);
    const g=document.createElement("span"); g.className="g"; g.textContent=l.scene;
    b.append(n,t,g);
    b.addEventListener("click",()=>{ current=i; render(); $("index-box").open=false; window.scrollTo({top:0,behavior:"smooth"}); });
    list.appendChild(b);
  });
  $("index-summary").textContent = "全部 "+LESSONS.length+" 句 · 已学会 "+done.length+" 句";
}

/* ---------------- 交互 ---------------- */
$("play-all").addEventListener("click",()=>speak(sentenceText(LESSONS[current])));
const slowBtn=$("slow");
function paintSlow(){ slowBtn.setAttribute("aria-pressed", slow?"true":"false"); slowBtn.textContent = slow ? "🐢 慢速（开）" : "🐢 慢速"; }
slowBtn.addEventListener("click",()=>{ slow=!slow; store.set(SLOW_KEY,slow); paintSlow(); speak(sentenceText(LESSONS[current])); });
paintSlow();

$("prev").addEventListener("click",()=>{ current=(current-1+LESSONS.length)%LESSONS.length; render(); });
$("next").addEventListener("click",()=>{ current=(current+1)%LESSONS.length; render(); });
$("today-btn").addEventListener("click",()=>{ current=todayIndex; render(); });
$("learned").addEventListener("click",()=>{
  const i=done.indexOf(current);
  if(i>=0) done.splice(i,1); else done.push(current);
  store.set(DONE_KEY,done); render();
});

$("today-meta").textContent = new Date().toLocaleDateString("zh-CN",{month:"long",day:"numeric",weekday:"long"});
voiceNote();
render();
</script>
